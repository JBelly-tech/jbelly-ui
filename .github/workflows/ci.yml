name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser (Playwright Chromium)
        run: |
          python -m pip install --quiet playwright pyyaml
          python -m playwright install --with-deps chromium
      - name: Skill frontmatter and size limits
        run: |
          python - <<'EOF'
          import re, sys
          s = open("skills/jbelly-ui/SKILL.md", encoding="utf-8").read()
          fm = re.search(r"^---\n(.*?)\n---", s, re.S).group(1)
          name = re.search(r"^name:\s*(.+)$", fm, re.M).group(1).strip()
          desc = re.search(r"^description:\s*(.+)$", fm, re.M).group(1).strip()
          assert name == "jbelly-ui", name
          assert "license:" in fm, "license missing in frontmatter"
          assert len(desc) <= 1024, "description too long"
          assert s.count("\n") < 500, "SKILL.md over 500 lines"
          assert len(s) // 4 < 5000, "SKILL.md over ~5000 tokens"
          print("frontmatter ok:", name, "|", len(desc), "chars |", s.count("\n"), "lines")
          EOF
      - name: Token lint and pre-flight on the shipped assets
        run: |
          python skills/jbelly-ui/scripts/lint_tokens.py skills/jbelly-ui
          python skills/jbelly-ui/scripts/preflight.py skills/jbelly-ui/assets/app-shell.html
          python skills/jbelly-ui/scripts/preflight.py skills/jbelly-ui/assets/landing-shell.html
          python skills/jbelly-ui/scripts/preflight.py skills/jbelly-ui/assets/pricing-shell.html
          python skills/jbelly-ui/scripts/preflight.py skills/jbelly-ui/assets/commerce-shell.html
          python skills/jbelly-ui/scripts/preflight.py skills/jbelly-ui/references/tokens.css
      - name: Every shipped demo reads in every personality, light and dark
        run: |
          for f in skills/jbelly-ui/assets/*-shell.html index.html; do
            echo "--- $f"
            python skills/jbelly-ui/scripts/verify_theme.py "$f"
          done
      - name: Every link this project publishes resolves
        run: python scripts/check_links.py
      - name: ...and the ones it only points at (not a gate: other people's sites move)
        continue-on-error: true
        run: python scripts/check_links.py --external
      - name: The project's own site passes the project's own checks
        run: |
          python skills/jbelly-ui/scripts/lint_tokens.py index.html
          python skills/jbelly-ui/scripts/preflight.py index.html
          python skills/jbelly-ui/scripts/verify_page.py index.html --variants ",#dark=1,#theme=theme-editorial,#theme=theme-clinic&dark=1,#lang=ar,#lang=ar&dark=1"
          python skills/jbelly-ui/scripts/check_controls.py index.html
      - name: Every control in every shipped demo does something
        run: |
          for f in skills/jbelly-ui/assets/*-shell.html; do
            echo "--- $f"
            python skills/jbelly-ui/scripts/check_controls.py "$f"
          done
      - name: dist/ must match the sources
        run: |
          python skills/jbelly-ui/scripts/build_dist.py
          python skills/jbelly-ui/scripts/export_tokens.py
          git diff --exit-code -- dist skills/jbelly-ui/assets/tokens.json
      - name: Smoke test (build a page from the example spec, render, verify)
        run: python tests/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tests/out/**
          if-no-files-found: ignore

  # The skill is installed by hand as often as by npx, and on macOS and Linux the terminal is the
  # interface -- there are no .ps1 twins there. "Python 3.9+, standard library only" and "all --help"
  # are claims in the docs; this is what makes them true rather than remembered. Python 3.9 is the
  # floor the compatibility table promises, so that is what runs here.
  portable:
    name: scripts on ${{ matrix.os }}, python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.9" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.9" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Every script says what it does, and does nothing else
        shell: bash
        run: |
          for f in skills/jbelly-ui/scripts/*.py scripts/*.py; do
            python "$f" --help > /dev/null || { echo "no --help: $f"; exit 1; }
          done
          # A help screen that writes a file is not a help screen. `git diff` alone would miss it:
          # new_screen.py takes its output path from argv[0], so `new_screen.py --help` wrote the
          # scaffold to a file called "--help" -- untracked, and committed here by accident once.
          test -z "$(git status --porcelain)" || { echo "--help changed the working tree:"; git status --porcelain; exit 1; }
      - name: Token lint and pre-flight on every shipped page
        shell: bash
        run: |
          python skills/jbelly-ui/scripts/lint_tokens.py skills/jbelly-ui
          python skills/jbelly-ui/scripts/lint_tokens.py index.html
          for f in skills/jbelly-ui/assets/*-shell.html index.html skills/jbelly-ui/references/tokens.css; do
            python skills/jbelly-ui/scripts/preflight.py "$f" > /dev/null || { echo "pre-flight failed: $f"; exit 1; }
          done
      - name: A page builds from a spec, and passes the same checks
        shell: bash
        run: |
          python skills/jbelly-ui/scripts/build-screen.py skills/jbelly-ui/assets/spec.example.json "$RUNNER_TEMP/page.html"
          python skills/jbelly-ui/scripts/lint_tokens.py "$RUNNER_TEMP/page.html"
          python skills/jbelly-ui/scripts/preflight.py "$RUNNER_TEMP/page.html" > /dev/null
          python skills/jbelly-ui/scripts/lint_motion.py "$RUNNER_TEMP/page.html" --quiet
      - name: The generated files are byte-identical on this platform
        shell: bash
        run: |
          python skills/jbelly-ui/scripts/export_tokens.py
          python skills/jbelly-ui/scripts/build_dist.py
          git diff --exit-code -- dist skills/jbelly-ui/assets/tokens.json
      - name: install.sh copies the skill
        if: runner.os != 'Windows'
        run: |
          ./install.sh custom "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/jbelly-ui/SKILL.md"
      - name: install.ps1 copies the skill
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Agent custom -Dest "$env:RUNNER_TEMP/skills"
          if (-not (Test-Path "$env:RUNNER_TEMP/skills/jbelly-ui/SKILL.md")) { exit 1 }
