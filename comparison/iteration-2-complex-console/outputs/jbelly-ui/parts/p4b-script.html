function renderDrawerMeasure(r) {

function validateField(el) { const wrap = el.closest('[data-field]'), ok = el.checkValidity(); if (wrap) wrap.classList.toggle('invalid', !ok); el.setAttribute('aria-invalid', ok ? 'false' : 'true'); return ok; }
function submitAppt(e) {
  e.preventDefault(); const bad = $$('#appt-form [required]').filter(el => !validateField(el));
  if (bad.length) { bad[0].focus(); live(`${bad.length} field${bad.length > 1 ? 's need' : ' needs'} attention`); return; }
  const name = $('#f-patient').value.trim(), diet = +$('#f-diet').value, branch = $('#f-branch').value, when = `${$('#f-date').value}T${$('#f-time').value}`, type = $('[name=f-type]:checked').value;
  if (apptMode) { Object.assign(apptMode, { time: when, diet, branch, type, status: 'Confirmed', fee: type === 'Consultation' ? 35 : 20 }); toast({ title: 'Appointment rescheduled', desc: `${name} · ${fmtDay(when)} ${when.slice(11, 16)} with ${DIETITIANS[diet].name}.` }); }
  else { const id = 'NP-' + (2400 + APPTS.length + 1); APPTS.push({ id, name, prog: 'weight', diet, branch, time: when, type, status: 'Confirmed', fee: type === 'Consultation' ? 35 : 20, age: 30, phone: '079 000 0000' }); toast({ title: 'Appointment booked', desc: `${name} · ${fmtDay(when)} ${when.slice(11, 16)} with ${DIETITIANS[diet].name}.` }); }
  apptDirty = false; closeOverlay('#appt-modal'); renderChips(); renderBody();
}
function doExport() { const n = filteredRows().length, filt = tbl.q || tbl.status !== 'all' || state.branch !== 'all'; toast({ title: `Exported ${n} ${filt ? 'filtered ' : ''}row${n === 1 ? '' : 's'} (CSV)`, desc: filt ? 'Current search, status and branch filters applied.' : 'All appointments in view.' }); }

/* ===================== Preferences + shell ===================== */
function setDark(on) { html.classList.toggle('dark', on); store.set('theme', on ? 'dark' : 'light'); $('#theme-toggle').setAttribute('aria-pressed', on); $('#ctl-dark').checked = on; }
function setDensity(compact) { html.classList.toggle('density-compact', compact); store.set('density', compact ? 'compact' : 'standard'); const b = $('#density-toggle'); b.setAttribute('aria-pressed', compact); b.dataset.tip = 'Density: ' + (compact ? 'compact' : 'standard'); }
function toggleLang() { state.lang = state.lang === 'ar' ? 'en' : 'ar'; applyLang(); }
function openSb() { $('#sidebar').classList.remove('hidden'); $('#sidebar').classList.add('flex'); $('#sb-overlay').classList.remove('hidden'); $('#sb-close').focus(); }
function closeSb() { $('#sidebar').classList.add('hidden'); $('#sidebar').classList.remove('flex'); $('#sb-overlay').classList.add('hidden'); $('#hamburger').focus(); }
const sbOpen = () => !$('#sb-overlay').classList.contains('hidden');
function setBranch(b) {
  state.branch = b; $('#branch-label').textContent = BRANCHES[b].name; $('#branch-filter').value = b; $('#sub-branch').textContent = BRANCHES[b].name;
  $$('#branch-menu [data-branch]').forEach(x => { const on = x.dataset.branch === b; x.setAttribute('aria-checked', on); const c = $('.branch-check', x); if (c) c.classList.toggle('invisible', !on); });
  tbl.page = 1; renderAll(); live(`Showing ${BRANCHES[b].name}`);
}
function updateSubRange() { const R = RANGES[state.range]; let label = R.label; if (state.range === 'custom') label = `${$('#range-from').value} → ${$('#range-to').value}`; $('#sub-range').textContent = state.compare ? `${label} vs ${R.prev}` : label; }
function setRange(r) { state.range = r; $$('#range-presets [data-range]').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === r)); const cr = $('#custom-range'); cr.classList.toggle('hidden', r !== 'custom'); cr.classList.toggle('flex', r === 'custom'); updateSubRange(); renderKpis(); renderLine(); if (r === 'custom') $('#range-from').focus(); }
let updatedAt = Date.now() - 4 * 60000;
function tickUpdated() { const m = Math.round((Date.now() - updatedAt) / 60000); $('#updated-ago').textContent = m < 1 ? 'just now' : `${m} min ago`; }
function renderAll() { renderKpis(); renderLine(); renderDonut(); renderCapacity(); renderHeatmap(); renderAdherence(); renderChips(); renderBody(); }

/* ===================== Tooltip (hover + focus, 300ms) ===================== */
const tip = $('#tip'); let tipTimer = null, tipEl = null;
function showTip(el) {
  const txt = el.dataset.tip; if (!txt) return; tip.textContent = txt; tip.classList.remove('hidden'); tipEl = el; el.setAttribute('aria-describedby', 'tip');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)), top = r.bottom + 8; if (top + th > innerHeight - 8) top = r.top - th - 8;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() { clearTimeout(tipTimer); tip.classList.add('hidden'); if (tipEl) { tipEl.removeAttribute('aria-describedby'); tipEl = null; } }

/* ===================== Init + event wiring ===================== */
(function init() {
  $('#f-diet').innerHTML = '<option value="">Choose…</option>' + DIETITIANS.map((d, i) => `<option value="${i}">${esc(d.name)} · ${esc(BRANCHES[d.branch].name)}</option>`).join('');
  $('#theme-toggle').setAttribute('aria-pressed', html.classList.contains('dark')); $('#ctl-dark').checked = html.classList.contains('dark');
  if (html.classList.contains('density-compact')) { $('#density-toggle').setAttribute('aria-pressed', 'true'); $('#density-toggle').dataset.tip = 'Density: compact'; }
  if (html.classList.contains('sidebar-collapsed')) { const b = $('#sidebar-toggle'); b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', 'Expand sidebar'); b.dataset.tip = 'Expand sidebar'; }
  const cols = store.get('cols'); if (cols) cols.split(',').filter(Boolean).forEach(k => tbl.hidden.add(k));

  renderLegend(); renderHead(); renderColsMenu(); applyCols(); renderAll(); renderKanban(); renderActivity(); renderTasks(); renderNotifs(); tickUpdated();
  wireLine(); wireKanban(); setInterval(tickUpdated, 30000);

  /* header + toolbar */
  $('#open-search').onclick = openPalette; $('#open-search-m').onclick = openPalette;
  $('#notif-btn').onclick = () => { renderNotifs(); openOverlay('#notif-drawer', { overlay: '#notif-overlay', focus: '#notif-tabs [role=tab]' }); };
  $('#notif-tabs').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (!b) return; notifTab = b.dataset.tab; $$('#notif-tabs [role=tab]').forEach(x => { const on = x === b; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; }); renderNotifs(); });
  $('#notif-tabs').addEventListener('keydown', e => arrowTabs(e, '#notif-tabs'));
  $('#notif-list').addEventListener('click', e => { const b = e.target.closest('[data-notif-read]'); if (b) { NOTIFS[+b.dataset.notifRead].unread = false; renderNotifs(); } });
  $('#notif-read').onclick = () => { NOTIFS.forEach(n => { n.unread = false; }); renderNotifs(); toast({ title: 'All notifications marked as read' }); };
  $('#notif-archive').onclick = () => { NOTIFS.length = 0; renderNotifs(); toast({ title: 'Notifications archived', desc: 'Find them later under Settings → Archive.' }); };
  $('#theme-toggle').onclick = () => setDark(!html.classList.contains('dark'));
  $('#ctl-dark').addEventListener('change', e => setDark(e.target.checked));
  $('#density-toggle').onclick = () => setDensity(!html.classList.contains('density-compact'));
  $('#lang-toggle').onclick = toggleLang;
  $('#open-shortcuts').onclick = () => { closeMenus(); openOverlay('#sc-modal', { overlay: '#sc-overlay' }); };
  $('#hamburger').onclick = openSb; $('#sb-close').onclick = closeSb; $('#sb-overlay').onclick = closeSb;
  $('#sidebar').addEventListener('mouseenter', () => html.classList.add('sb-anim'), { once: true });
  $('#sidebar-toggle').onclick = () => { html.classList.add('sb-anim'); const c = html.classList.toggle('sidebar-collapsed'); store.set('sidebar', c ? 'collapsed' : 'open'); const b = $('#sidebar-toggle'); b.setAttribute('aria-expanded', !c); b.setAttribute('aria-label', c ? 'Expand sidebar' : 'Collapse sidebar'); b.dataset.tip = c ? 'Expand sidebar' : 'Collapse sidebar'; };
  $$('[data-toggle-group]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); const open = a.closest('.nav-group').classList.toggle('open'); a.setAttribute('aria-expanded', open); }));
  $('#sidebar').addEventListener('click', e => { const a = e.target.closest('.nav-link:not([data-toggle-group]), .nav-child'); if (!a) return; e.preventDefault(); $$('#sidebar .active').forEach(x => { x.classList.remove('active'); x.removeAttribute('aria-current'); }); a.classList.add('active'); a.setAttribute('aria-current', 'page'); live(`${a.textContent.trim()} (demo navigation)`); if (sbOpen()) closeSb(); });
  $('#branch-menu').addEventListener('click', e => { const b = e.target.closest('[data-branch]'); if (b) { setBranch(b.dataset.branch); closeMenus(true); } });
  $('#branch-filter').addEventListener('change', e => setBranch(e.target.value));
  $('#range-presets').addEventListener('click', e => { const b = e.target.closest('[data-range]'); if (b) setRange(b.dataset.range); });
  $('#range-from').addEventListener('change', updateSubRange); $('#range-to').addEventListener('change', updateSubRange);
  $('#compare').addEventListener('change', e => { state.compare = e.target.checked; updateSubRange(); renderKpis(); renderLine(); });
  $('#export').onclick = doExport; $('#new-appt').onclick = () => openApptModal();
  $('#refresh').onclick = () => { const b = $('#refresh'), s = $('svg', b); b.disabled = true; if (s) s.classList.add('animate-spin'); setTimeout(() => { updatedAt = Date.now(); tickUpdated(); b.disabled = false; if (s) s.classList.remove('animate-spin'); renderAll(); live('Data refreshed'); }, 700); };

  /* table */
  $('#appt-card').addEventListener('click', e => {
    const tg = e.target;
    const sort = tg.closest('[data-sort]'); if (sort) return cycleSort(sort.dataset.sort);
    const pg = tg.closest('[data-page]'); if (pg) { const p = +pg.dataset.page, pages = Math.max(1, Math.ceil(filteredRows().length / tbl.size)); if (p >= 1 && p <= pages) { tbl.page = p; renderBody(); const nb = $(`[data-page="${p}"]`); if (nb) nb.focus(); } return; }
    const chip = tg.closest('[data-status]'); if (chip) { tbl.status = chip.dataset.status; tbl.page = 1; renderChips(); renderBody(); $(`[data-status="${chip.dataset.status}"]`).focus(); return; }
    const st = tg.closest('[data-state]'); if (st) return setTableState(st.dataset.state);
    const den = tg.closest('[data-density]'); if (den) { tbl.density = den.dataset.density; $$('#tbl-density [data-density]').forEach(b => b.setAttribute('aria-pressed', b === den)); $('#tbl-wrap').classList.toggle('tbl-compact', tbl.density === 'compact'); return; }
    if (tg.closest('#clear-filters')) { tbl.q = ''; $('#tbl-search').value = ''; tbl.status = 'all'; tbl.page = 1; renderChips(); renderBody(); $('#tbl-search').focus(); return; }
    if (tg.closest('#empty-new')) return openApptModal();
    const op = tg.closest('[data-open]'); if (op) return openDrawer(op.dataset.open);
    const rs = tg.closest('[data-resched]'); if (rs) return openApptModal(APPTS.find(a => a.id === rs.dataset.resched));
    const rm = tg.closest('[data-row-menu]'); if (rm) { e.stopPropagation(); if (openMenu && openMenu.btn === rm) closeMenus(); else openRowMenu(rm); return; }
    const bk = tg.closest('[data-bulk]'); if (bk) return bulk(bk.dataset.bulk);
    if (tg.closest('#sel-clear')) return clearSel();
    if (tg.closest('#sel-all-link')) { filteredRows().forEach(r => tbl.sel.add(r.id)); renderBody(); return; }
    if (tg.closest('button, a, input, label, .menu')) return;
    const tr = tg.closest('#tbody tr[data-id]'); if (tr) openDrawer(tr.dataset.id);
  });
  $('#appt-card').addEventListener('change', e => {
    const tg = e.target;
    if (tg.id === 'check-all') { $$('#tbody tr[data-id]').forEach(r => { if (tg.checked) tbl.sel.add(r.dataset.id); else tbl.sel.delete(r.dataset.id); }); renderBody(); $('#check-all').focus(); return; }
    if (tg.classList.contains('row-check')) return toggleSel(tg.closest('tr').dataset.id, tg.checked);
    if (tg.id === 'page-size') { tbl.size = +tg.value; tbl.page = 1; renderBody(); return; }
    if (tg.dataset.colkey) { if (tg.checked) tbl.hidden.delete(tg.dataset.colkey); else tbl.hidden.add(tg.dataset.colkey); applyCols(); }
  });
  let qTimer; $('#tbl-search').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { tbl.q = e.target.value.trim().toLowerCase(); tbl.page = 1; renderChips(); renderBody(); }, 150); });
  $('#tbody').addEventListener('keydown', e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return; const onRow = e.target === tr;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling; if (n && n.dataset.id) n.focus(); }
    else if (onRow && e.key === 'Enter') { e.preventDefault(); openDrawer(tr.dataset.id); }
    else if (onRow && e.key === ' ') { e.preventDefault(); toggleSel(tr.dataset.id, !tbl.sel.has(tr.dataset.id)); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); const id = tr.dataset.id; $$('#tbody tr[data-id]').forEach(r => tbl.sel.add(r.dataset.id)); renderBody(); const again = $(`#tbody tr[data-id="${id}"]`); if (again) again.focus(); }
    else if (e.key === 'Delete' && tbl.sel.size) { e.preventDefault(); cancelAppts([...tbl.sel]); }
  });
  rowMenu.addEventListener('click', e => {
    const b = e.target.closest('[data-rm]'); if (!b) return; const r = APPTS.find(a => a.id === rowMenu.dataset.id); closeMenus(true);
    if (b.dataset.rm === 'remind') toast({ title: `Reminder sent to ${r.name}`, desc: 'SMS + WhatsApp.' });
    else if (b.dataset.rm === 'checkin') { r.status = 'Checked in'; renderChips(); renderBody(); toast({ title: `${r.name} checked in` }); }
    else if (b.dataset.rm === 'resched') openApptModal(r);
    else if (b.dataset.rm === 'cancel') cancelAppts([r.id]);
  });

  /* drawer */
  $('#drawer-tabs').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) selectDrawerTab(b.dataset.tab); });
  $('#drawer-tabs').addEventListener('keydown', e => arrowTabs(e, '#drawer-tabs'));
  $('#note').addEventListener('input', () => { noteDirty = !!$('#note').value.trim(); $('#note-save').disabled = !noteDirty; $('#note-status').textContent = noteDirty ? 'Unsaved changes' : 'Saved · 2 h ago'; });
  $('#note').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !$('#note-save').disabled) $('#note-save').click(); });
  $('#note-save').onclick = () => { noteDirty = false; $('#note-save').disabled = true; $('#note-status').textContent = 'Saved · just now'; toast({ title: 'Note saved', desc: `Added to ${drawerRow.name}'s record.` }); };
  $('#drawer-prev').onclick = async () => { const list = filteredRows(), i = list.findIndex(a => a.id === drawerRow.id); if (i > 0 && await guardNote()) openDrawer(list[i - 1].id); };
  $('#drawer-next').onclick = async () => { const list = filteredRows(), i = list.findIndex(a => a.id === drawerRow.id); if (i >= 0 && i < list.length - 1 && await guardNote()) openDrawer(list[i + 1].id); };
  $('#drawer-remind').onclick = () => toast({ title: `Reminder sent to ${drawerRow.name}`, desc: 'SMS + WhatsApp.' });

  /* palette */
  $('#palette-input').addEventListener('input', renderPalette);
  $('#palette-input').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); palSet(palIdx + 1); } else if (e.key === 'ArrowUp') { e.preventDefault(); palSet(palIdx - 1); } else if (e.key === 'Enter') { e.preventDefault(); palRun(palIdx); } });
  $('#palette-list').addEventListener('click', e => { const it = e.target.closest('[data-pal]'); if (it) palRun(+it.dataset.pal); });
  $('#palette-list').addEventListener('mousemove', e => { const it = e.target.closest('[data-pal]'); if (it && +it.dataset.pal !== palIdx) palSet(+it.dataset.pal); });

  /* form modal */
  $('#appt-form').addEventListener('input', () => { apptDirty = true; });
  $('#appt-form').addEventListener('change', () => { apptDirty = true; });
  $$('#appt-form [required]').forEach(el => { el.addEventListener('blur', () => validateField(el)); el.addEventListener('input', () => { if (el.getAttribute('aria-invalid') === 'true') validateField(el); }); el.addEventListener('change', () => { if (el.getAttribute('aria-invalid') === 'true') validateField(el); }); });
  $('#appt-form').addEventListener('submit', submitAppt);
  $('#appt-form').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); $('#appt-form').requestSubmit(); } });

  /* generic delegated handlers */
  document.addEventListener('click', e => {
    const mb = e.target.closest('[data-menu]');
    if (mb) { e.stopPropagation(); const menu = $(mb.dataset.menu), was = openMenu && openMenu.menu === menu; closeMenus(); if (!was) { menu.classList.remove('hidden'); mb.setAttribute('aria-expanded', 'true'); openMenu = { btn: mb, menu }; if (e.detail === 0) { const f = $('.menu-item:not(label), .menu-item input, button', menu); if (f) f.focus(); } } return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenus();
    const c = e.target.closest('[data-close]'); if (c) { const s = stack.find(x => x.id === c.dataset.close); if (s && s.onEsc) s.onEsc(); else closeOverlay(c.dataset.close); return; }
    const cf = e.target.closest('[data-confirm]'); if (cf) return finishConfirm(cf.dataset.confirm === 'yes');
    const tb = e.target.closest('[data-toast]'); if (tb) { toast({ title: tb.dataset.toast, kind: 'info' }); if (tb.closest('.menu')) closeMenus(); return; }
    const a = e.target.closest('a[href="#"]'); if (a) e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (isOpen('#palette')) closeOverlay('#palette'); else openPalette(); return; }
    if (e.key === 'Escape') {
      if (closeMenus(true)) { e.preventDefault(); return; }
      if (sbOpen()) { e.preventDefault(); closeSb(); return; }
      if (stack.length) { e.preventDefault(); const top = stack[stack.length - 1]; if (top.onEsc) top.onEsc(); else closeOverlay(top.id); }
      return;
    }
    if (e.key === 'Tab' && stack.length) {
      const top = stack[stack.length - 1].el, f = focusables(top); if (!f.length) { e.preventDefault(); return; }
      const first = f[0], last = f[f.length - 1], inside = top.contains(document.activeElement);
      if (e.shiftKey && (document.activeElement === first || !inside)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !inside)) { e.preventDefault(); first.focus(); }
      return;
    }
    if (openMenu && openMenu.menu.contains(document.activeElement) && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault(); const items = $$('.menu-item:not(label), .menu-item input, .menu > button', openMenu.menu).filter(i => !i.disabled); let i = items.indexOf(document.activeElement); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; if (items[i]) items[i].focus(); return;
    }
    const typing = ['input', 'textarea', 'select'].includes((e.target.tagName || '').toLowerCase()) || e.target.isContentEditable;
    if (e.key === '?' && !typing && !stack.length) { e.preventDefault(); openOverlay('#sc-modal', { overlay: '#sc-overlay' }); }
  });
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (!el || el === tipEl) return; clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(el), 300); });
  document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
  document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
  document.addEventListener('scroll', hideTip, true);
  $('#tasks').addEventListener('change', e => { const i = e.target.dataset.task; if (i == null) return; TASKS[+i].done = e.target.checked; renderTasks(); $('#task-' + i).focus(); live(`${TASKS[+i].t} ${TASKS[+i].done ? 'completed' : 'reopened'}`); });

  /* URL preset for the table state, then language */
  const st = new URLSearchParams(location.hash.slice(1)).get('state'); if (['loading', 'empty', 'error'].includes(st)) setTableState(st);
  applyLang(); icons();
})();
